name: Build EasyEnglish APK (GitHub Only)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your source code
        uses: actions/checkout@v4
        with:
          path: source_code

      - name: Setup Java 17 (required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Create fresh Flutter project (generates android/ folder)
        run: |
          flutter create -t app easyenglish_build

      - name: Copy your source code into the new Flutter project
        run: |
          cd easyenglish_build
          rm -rf lib assets pubspec.yaml
          cp -r ../source_code/lib .
          cp -r ../source_code/assets .
          cp ../source_code/pubspec.yaml .

      - name: Install dependencies
        run: |
          cd easyenglish_build
          flutter pub get

      - name: Build Release APK
        run: |
          cd easyenglish_build
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyEnglish-Chinese-APK
          path: easyenglish_build/build/app/outputs/flutter-apk/app-release.apk
